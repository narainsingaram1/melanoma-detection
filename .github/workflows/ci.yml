name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install CPU-only dependencies
        run: |
          pip install torch==2.13.0 torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-api.txt onnx==1.23.2 pytest==9.0.2 pandas==2.3.1 scikit-learn==1.7.1 scipy==1.16.1 matplotlib==3.10.6 seaborn==0.13.2
      - name: Run tests
        run: python -m pytest -q
